[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsa-throughput"
version = "0.1.0"
description = "Discover, download, and parse TSA public FOIA throughput PDF reports."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Joel Peach", email = "joel@bearing.aero" }
]
license = { text = "Mozilla Public License 2.0 (MPL-2.0)" }
keywords = [
  "tsa",
  "airport",
  "aviation",
  "throughput",
  "foia",
  "pdf",
  "data"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pdfplumber>=0.11"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "twine>=5"
]

[project.urls]
Homepage = "https://github.com/<owner>/tsa-throughput"
Repository = "https://github.com/<owner>/tsa-throughput"
Issues = "https://github.com/<owner>/tsa-throughput/issues"

[project.scripts]
tsa-throughput = "tsa_throughput.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tsa_throughput = ["assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-markers",
  "--strict-config"
]
markers = [
  "integration: tests that require live network access or external services"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM"
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
packages = ["tsa_throughput"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = false
